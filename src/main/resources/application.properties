spring.application.name=project

spring.datasource.url=jdbc:mysql://localhost:3306/hospital_db?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=123456789

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.show_sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
spring.servlet.multipart.enabled=true

jwt.secret=${secretSignature}
jwt.access-token-expiration=1800000
jwt.refresh-token-expiration=604800000

cloudinary.cloud-name=da3olfyka
cloudinary.api-key=${cloudinaryKey}
cloudinary.api-secret=${cloudinarySecret}